name: YouTube Phone Login

on:
  workflow_dispatch: {}

jobs:
  youtube-phone-login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run phone device-code login
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python youtube_phone_auth.py

      - name: Upload token.json artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-token
          path: token.json
          retention-days: 1
