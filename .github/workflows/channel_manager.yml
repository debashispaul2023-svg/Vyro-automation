name: AI Channel Manager (dry-run)

on:
  schedule:
    # Once a day, after the US-night Daily slot. Does not generate videos.
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  channel-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth token if present
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python - << 'PY'
          import base64, json, os, sys

          raw_json = (os.environ.get("YOUTUBE_TOKEN_JSON") or "").strip()
          raw_b64 = (os.environ.get("YOUTUBE_TOKEN_B64") or "").strip()

          def looks_like_token(text: str) -> bool:
              try:
                  data = json.loads(text)
              except json.JSONDecodeError:
                  return False
              return isinstance(data, dict) and (
                  "refresh_token" in data or "token" in data or "client_id" in data
              )

          def try_b64(blob: str):
              if not blob:
                  return None
              compact = "".join(blob.split())
              for candidate in (blob, compact):
                  try:
                      decoded = base64.b64decode(candidate, validate=False).decode("utf-8")
                  except Exception:
                      continue
                  if looks_like_token(decoded):
                      return decoded
              return None

          token = raw_json if looks_like_token(raw_json) else None
          if token is None:
              token = try_b64(raw_json) or try_b64(raw_b64)
          if not token:
              print("No usable YouTube token — channel manager will no-op")
              sys.exit(0)
          with open("token.json", "w", encoding="utf-8") as f:
              json.dump(json.loads(token), f)
          print(f"Wrote token.json ({os.path.getsize('token.json')} bytes)")
          PY

      - name: Run AI Channel Manager
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          # Leave unset / false until dry-run logs look safe.
          # CHANNEL_MANAGER_APPLY_CHANGES: "true"
        run: python channel_manager.py

      - name: Commit action log
        if: always()
        run: |
          git config user.name "vyro-bot"
          git config user.email "vyro-bot@users.noreply.github.com"
          if [ -f channel_manager_actions.json ]; then
            git add channel_manager_actions.json
          fi
          if git diff --staged --quiet; then
            echo "No channel-manager log changes"
          else
            git commit -m "Update channel manager log [skip ci]"
            git push
          fi
