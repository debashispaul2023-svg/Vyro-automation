name: TEST - Metadata + YouTube (Part 5)

on:
  workflow_dispatch:
    inputs:
      doc_url:
        description: "Optional Google Doc URL (blank = known U2 doc)"
        required: false
        default: ""
      clip_file_id:
        description: "Optional Drive file id (blank = Part 4 winner Comp 1_43)"
        required: false
        default: ""

jobs:
  test-youtube-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python - << 'PY'
          import base64, json, os, sys

          raw_json = (os.environ.get("YOUTUBE_TOKEN_JSON") or "").strip()
          raw_b64 = (os.environ.get("YOUTUBE_TOKEN_B64") or "").strip()

          def looks_like_token(text: str) -> bool:
              try:
                  data = json.loads(text)
              except json.JSONDecodeError:
                  return False
              return isinstance(data, dict) and (
                  "refresh_token" in data or "token" in data or "client_id" in data
              )

          def try_b64(label: str, blob: str):
              if not blob:
                  return None
              compact = "".join(blob.split())
              for candidate in (blob, compact):
                  try:
                      decoded = base64.b64decode(candidate, validate=False).decode("utf-8")
                  except Exception:
                      continue
                  if looks_like_token(decoded):
                      print(f"Decoded valid token from {label} (base64)")
                      return decoded
              return None

          token = None
          if looks_like_token(raw_json):
              print("YOUTUBE_TOKEN_JSON is already valid token JSON")
              token = raw_json
          else:
              token = try_b64("YOUTUBE_TOKEN_JSON", raw_json) or try_b64("YOUTUBE_TOKEN_B64", raw_b64)

          if not token:
              print("Could not build a valid token.json")
              print(f"YOUTUBE_TOKEN_JSON length: {len(raw_json)}")
              print(f"YOUTUBE_TOKEN_B64 length: {len(raw_b64)}")
              if raw_json:
                  print(f"YOUTUBE_TOKEN_JSON starts with: {raw_json[:1]!r} lines={raw_json.count(chr(10))+1}")
              sys.exit(1)

          with open("token.json", "w", encoding="utf-8") as f:
              json.dump(json.loads(token), f)
          print(f"Wrote token.json ({os.path.getsize('token.json')} bytes)")
          PY

      - name: Run isolated metadata + YouTube upload test
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DOC_URL: ${{ github.event.inputs.doc_url }}
          PART5_CLIP_FILE_ID: ${{ github.event.inputs.clip_file_id }}
        run: python test_youtube_upload.py

      - name: Upload rendered short as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part5-short
          path: output/short.mp4
          if-no-files-found: ignore
