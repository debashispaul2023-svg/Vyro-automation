name: TEST - Instagram Reels (Part 6)

on:
  workflow_dispatch:
    inputs:
      clip_file_id:
        description: "Optional Drive file id (blank = Part 4 winner Comp 1_43)"
        required: false
        default: ""

jobs:
  test-instagram-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run isolated Instagram upload test
        env:
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          ASSET_HOST_REPO: ${{ secrets.ASSET_HOST_REPO }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
          PART6_CLIP_FILE_ID: ${{ github.event.inputs.clip_file_id }}
        run: python test_instagram_upload.py
        
