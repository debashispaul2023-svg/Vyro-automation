name: Vyro Campaign Pipeline

on:
  workflow_dispatch:
    inputs:
      source_video_url:
        description: "Direct URL to the raw 16:9 source video"
        required: true
      campaign_text:
        description: "Paste campaign requirements as plain text (hashtags, duration, code, link) — leave blank to use campaign.json instead"
        required: false
        default: ""
      hook:
        description: "Video hook/title text"
        required: true
      summary:
        description: "Short description summary"
        required: false
        default: ""
      privacy:
        description: "YouTube privacy status"
        required: false
        default: "unlisted"
  push:
    branches: [main]
    paths:
      - "campaign.json"

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Download source video
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          URL="${{ github.event.inputs.source_video_url }}"
          if [[ "$URL" == *"drive.google.com"* ]]; then
            pip install --quiet gdown
            FILE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+' || echo "$URL" | grep -oP '(?<=id=)[^&]+')
            echo "Extracted file ID: $FILE_ID"
            gdown "https://drive.google.com/uc?id=$FILE_ID" -O input_16x9.mp4
          else
            curl -L "$URL" -o input_16x9.mp4
          fi
          echo "--- Downloaded file info ---"
          ls -la input_16x9.mp4
          file input_16x9.mp4
          head -c 300 input_16x9.mp4 || true

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Run Vyro pipeline (render + metadata + validate + YouTube upload)
        env:
          CAMPAIGN_TEXT: ${{ github.event.inputs.campaign_text }}
        run: |
          if [ -n "$CAMPAIGN_TEXT" ]; then
            CAMPAIGN_ARG="$CAMPAIGN_TEXT"
          else
            CAMPAIGN_ARG="campaign.json"
          fi
          python main.py \
            --campaign "$CAMPAIGN_ARG" \
            --source input_16x9.mp4 \
            --output output/short.mp4 \
            --hook "${{ github.event.inputs.hook || 'Auto campaign clip' }}" \
            --summary "${{ github.event.inputs.summary }}" \
            --privacy "${{ github.event.inputs.privacy || 'unlisted' }}"

      - name: Upload rendered short as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vyro-short
          path: output/short.mp4

      - name: Upload video URL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-url
          path: video_url.txt

      - name: Print video URL in job summary
        run: |
          echo "### 🎬 Uploaded video URL — copy this into Vyro" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat video_url.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
