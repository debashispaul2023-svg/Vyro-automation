name: TEST - Whop Submit (Part 7)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Public IG / YouTube / TikTok URL to put in Submit clip"
        required: true
        default: ""
      confirm_submit:
        description: "yes = actually click Submit. Anything else = dry run."
        required: false
        default: "no"

jobs:
  test-whop-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run isolated Whop submit test
        env:
          WHOP_COOKIE_HEADER: ${{ secrets.WHOP_COOKIE_HEADER }}
          VIDEO_URL: ${{ github.event.inputs.video_url }}
          CONFIRM_SUBMIT: ${{ github.event.inputs.confirm_submit }}
        run: python test_whop_submit.py
