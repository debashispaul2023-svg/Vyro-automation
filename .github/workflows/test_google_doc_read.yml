name: TEST - Google Doc Read (Part 3)

on:
  workflow_dispatch:
    inputs:
      doc_url:
        description: "Optional: specific Google Doc URL to test (leave blank to auto-fetch from live Whop campaign)"
        required: false
        default: ""

jobs:
  test-google-doc-read:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install playwright requests

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run isolated Google Doc read test
        env:
          WHOP_COOKIE_HEADER: ${{ secrets.WHOP_COOKIE_HEADER }}
          GOOGLE_DOC_URL: ${{ github.event.inputs.doc_url }}
        run: python test_google_doc_read.py
