name: Vyro Daily Full Automation

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Restore YouTube OAuth token if present
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -n "$YOUTUBE_TOKEN_JSON" ]; then
            printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json
            echo "Wrote token.json ($(wc -c < token.json) bytes)"
          else
            echo "No YOUTUBE_TOKEN_JSON secret — pipeline will stop after render"
          fi

      - name: Run daily pipeline (Parts 1-4 always; YouTube only if token is ready)
        env:
          VYRO_SESSION_COOKIE: ${{ secrets.VYRO_SESSION_COOKIE }}
          WHOP_COOKIE_HEADER: ${{ secrets.WHOP_COOKIE_HEADER }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          ASSET_HOST_REPO: ${{ secrets.ASSET_HOST_REPO }}
          ASSET_HOST_TOKEN: ${{ secrets.ASSET_HOST_TOKEN }}
        run: python daily_runner.py

      - name: Upload rendered short as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyro-daily-short
          path: output/short.mp4
          if-no-files-found: ignore

      - name: Commit updated processed_campaigns.json
        if: always()
        run: |
          git config user.name "vyro-bot"
          git config user.email "vyro-bot@users.noreply.github.com"
          git add processed_campaigns.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update processed campaigns [skip ci]"
          git push || true
