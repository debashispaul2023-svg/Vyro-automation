name: Vyro Daily Full Automation

on:
  schedule:
    - cron: "0 6 * * *"  # প্রতিদিন UTC 06:00 (বাংলাদেশ/ভারত সময় বেলা ১২টা)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: echo "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Run daily check + full pipeline (Vyro -> render -> YouTube -> Vyro)
        env:
          VYRO_EMAIL: ${{ secrets.VYRO_EMAIL }}
          VYRO_PASSWORD: ${{ secrets.VYRO_PASSWORD }}
        run: python daily_runner.py

      - name: Upload rendered short as artifact (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyro-daily-short
          path: output/short.mp4
          if-no-files-found: ignore

      - name: Commit updated processed_campaigns.json
        if: always()
        run: |
          git config user.name "vyro-bot"
          git config user.email "vyro-bot@users.noreply.github.com"
          git add processed_campaigns.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update processed campaigns [skip ci]"
          git push || true
