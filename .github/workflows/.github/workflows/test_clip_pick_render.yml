name: TEST - Clip Pick + Render (Part 4)

on:
  workflow_dispatch:
    inputs:
      doc_url:
        description: "Optional Google Doc URL (blank = live Whop campaign)"
        required: false
        default: ""

jobs:
  test-clip-pick-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg + imagemagick
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Fix ImageMagick security policy for text rendering
        run: sudo sed -i '/pattern="@\*"/d' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run isolated clip-pick + render test
        env:
          WHOP_COOKIE_HEADER: ${{ secrets.WHOP_COOKIE_HEADER }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_DOC_URL: ${{ github.event.inputs.doc_url }}
        run: python test_clip_pick_render.py

      - name: Upload rendered short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part4-short
          path: output/short.mp4
          if-no-files-found: ignore
