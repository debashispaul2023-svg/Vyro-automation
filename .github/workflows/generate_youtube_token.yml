name: Generate YouTube token.json (phone-friendly)

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "Leave blank for Step 1 (get the auth link). Paste the 'code=' value here for Step 2 (exchange it)."
        required: false
        default: ""

jobs:
  generate-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run manual OAuth step
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: python generate_youtube_token_manual.py
